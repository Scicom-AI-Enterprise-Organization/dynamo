# model-swap: the DynamoModelSwap controller. One replica: the swap state lives in each DynamoModelSwap's status.

# The namespace whose DynamoModelSwaps the controller runs, and where its slot DynamoGraphDeployments and the
# frontend-only graph live. Empty: the release namespace.
watchNamespace: ""

# The controller is plain Python on a stock image; the code comes from a ConfigMap built from controller/.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Install the Kubernetes client into an emptyDir at start (needs PyPI, or a mirror in indexUrl). Set install to
# false when the image already has the packages.
deps:
  install: true
  packages:
    - kubernetes==31.0.0
  indexUrl: ""

nameOverride: ""
# Keep the names of an existing install, e.g. dynamoswap-controller for the B300 reload lab.
fullnameOverride: ""

nodeSelector: {}
tolerations: []

# hostNetwork: an in-place reload calls the workers' /engine/ admin routes on their system ports. On clusters that
# firewall those routes to a node's own host network (B300's admin-port-guard), the controller must run there too.
hostNetwork: true
# The liveness endpoint. With hostNetwork it is a host port: pick one that is free on the node.
healthPort: 18080
# Longest wait for running requests to finish when an in-place reload pauses an engine (wait mode). Past it the
# reload is abandoned (the engine resumes on its old weights) and the swap goes through the bridge.
pauseCapSeconds: 60

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
