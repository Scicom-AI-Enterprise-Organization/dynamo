# The controller code (controller/*.py: main, logic, and fetch, the node Job's script), mounted at /app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "model-swap.fullname" . }}-code
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-swap.labels" . | nindent 4 }}
data:
  {{- include "model-swap.code" . | nindent 2 }}
