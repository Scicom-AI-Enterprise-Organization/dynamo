# DynamoModelSwap: one Dynamo prefill + decode pair whose model changes with no downtime on one replica. Edit
# spec.model or spec.revision (or anything in spec) and the model-swap controller runs the swap by itself: a download
# gate on every node of the graph, then an in-place reload of the running pair when only the weights change, or else a
# bridge copy of the new model at 0.27 beside the old at 0.70, the old removed once the frontend routes to the bridge,
# the new at 0.70 once the old is gone, then the bridge removed. --served-model-name stays spec.servedModelName.
# Helm installs this file on the first install only and never upgrades or deletes it: apply schema changes with
# kubectl apply -f. Under Argo CD it is synced like any manifest, and the annotations below keep it when its
# Application is deleted or stops rendering it: deleting this CRD deletes every DynamoModelSwap in the cluster, and
# with them (owner references) every slot they serve from.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamoswaps.dynamoswap.scicom.dev
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  group: dynamoswap.scicom.dev
  scope: Namespaced
  names:
    kind: DynamoModelSwap
    plural: dynamoswaps
    singular: dynamoswap
    shortNames: [dms]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Serving, type: string, jsonPath: .status.servingModel}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Desired, type: string, jsonPath: .spec.model, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [model, servedModelName, graph]
              properties:
                model:
                  type: string
                  description: HF repo id. The one field to edit for a swap. The download gate fetches it into each node's /data/hf (from the AI Foundry hub with fetch.tokenSecret, or offline when that Secret is absent); the engines stay HF_HUB_OFFLINE.
                revision:
                  type: string
                  default: ""
                  description: Optional full commit hash (or a branch the nodes have) of spec.model. Empty = main. A new revision of the same model is a swap like any other, usually in place.
                reload:
                  type: string
                  enum: [Auto, Bridge]
                  default: Auto
                  description: Auto reloads the running pair in place when only the weights change (needs versionAlias false); Bridge always swaps through a 0.27 bridge.
                fetch:
                  type: object
                  properties:
                    image: {type: string, description: "Image of the gate Jobs (default: the graph's own runtime image)."}
                    hfEndpoint: {type: string}
                    tokenSecret: {type: string, description: "Secret with key token for the hub (default aif-hub-token; optional)."}
                    timeoutSeconds: {type: integer}
                servedModelName:
                  type: string
                  description: The name callers send. Every slot registers it as its primary name, so it never changes.
                servedModelAliases:
                  type: array
                  items: {type: string}
                  description: More names every slot serves, fixed across swaps (e.g. the name callers sent before servedModelName existed). Changing them is a bridge swap.
                versionAlias:
                  type: boolean
                  default: true
                  description: Also register spec.model as an alias, so a caller can pin one version during a swap. A running slot's names cannot change, so in-place reloads need it off.
                frontendGraph:
                  type: string
                  default: lab
                  description: The frontend-only DGD that discovers the slots (they are named <frontendGraph>-<swap>-<f|b><n>).
                steady:
                  type: object
                  properties:
                    gpuMemoryUtilization: {type: number}
                    gpumemPercentage: {type: integer}
                bridge:
                  type: object
                  properties:
                    gpuMemoryUtilization: {type: number}
                    gpumemPercentage: {type: integer}
                readyTimeoutSeconds:
                  type: integer
                  description: How long a slot may take to be routed to before it counts as failed (default 1800).
                fullRetries:
                  type: integer
                  description: Retries of a failed full engine before the swap stops on the bridge (default 1).
                graph:
                  type: object
                  description: >-
                    A DynamoGraphDeployment spec with exactly one prefill and one decode component, cards pinned with
                    nvidia.com/use-gpuuuid. The controller owns --model, --served-model-name, --gpu-memory-utilization,
                    the host ports and nvidia.com/gpumem-percentage, and strips any it finds here.
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
